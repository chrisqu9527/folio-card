name: FOLIO data integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-folio-data.mjs
      - run: node --test scripts/folio-sync.test.mjs
